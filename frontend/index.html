<!DOCTYPE html>
<html lang="pt">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Gestão de alunos</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>

  <header>
    <div class="pagina topo">
      <div>
        <h1>Gestão de alunos</h1>
        <p>Ver, adicionar, editar e apagar alunos</p>
      </div>
      <button id="btn-novo" type="button">+ Novo aluno</button>
    </div>
  </header>

  <main class="pagina">
    <div class="ferramentas">
      <input id="pesquisa" type="search" placeholder="Pesquisar aluno" aria-label="Pesquisar aluno">
      <select id="filtro-curso" aria-label="Filtrar por curso">
        <option value="">Todos os cursos</option>
      </select>
    </div>

    <p id="estado" class="estado">A carregar alunos…</p>
    <ul id="lista" class="lista"></ul>
  </main>

  <!-- Formulário para adicionar ou editar um aluno -->
  <dialog id="dialogo">
    <form id="form">
      <h2 id="form-titulo">Novo aluno</h2>

      <div class="campo">
        <label for="nome">Nome</label>
        <input id="nome" name="nome" type="text" autocomplete="off" pattern=".*\S.*" required>
      </div>

      <div class="campo">
        <label for="apelido">Apelido</label>
        <input id="apelido" name="apelido" type="text" autocomplete="off" pattern=".*\S.*" required>
      </div>

      <div class="campo">
        <label for="idCurso">Curso</label>
        <select id="idCurso" name="idCurso" required>
          <option value="">Escolhe um curso</option>
        </select>
      </div>

      <div class="campo">
        <label for="anoCurricular">Ano curricular</label>
        <select id="anoCurricular" name="anoCurricular" required>
          <option value="1">1.º ano</option>
          <option value="2">2.º ano</option>
          <option value="3">3.º ano</option>
        </select>
      </div>

      <p id="form-erro" class="texto-erro" hidden></p>

      <div class="botoes">
        <button id="btn-cancelar" type="button">Cancelar</button>
        <button type="submit" class="primario">Guardar</button>
      </div>
    </form>
  </dialog>

  <div id="aviso" role="status" hidden></div>

  <script src="script.js"></script>
</body>
</html>
